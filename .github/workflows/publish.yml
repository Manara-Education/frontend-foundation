# Publishes the frontend container image to GHCR.
#
# Runs when a GitHub Release is published — that is, after release.yml has
# already proved the tag is valid semver and that the tagged commit is on
# `main`. This workflow does not re-litigate that; it builds the image for the
# released commit and pushes it. Deployment is separate again, and reacts to the
# image existing.
#
# Tags applied to every published image:
#
#   :v1.4.0       the release. This is what production pins to.
#   :sha-abc1234  the exact commit, immutable forever.
#
# The SHA tag is the one that matters when something has gone wrong. A version
# tag is a label a human chose and can in principle be moved or re-pushed; the
# SHA tag answers "what code is actually running" with no ambiguity, and it is
# what the release manifest records.
#
# There is deliberately NO `latest`. Production pins an exact version in .env so
# that a deployment is reproducible and a rollback is editing one line back.
# `latest` would quietly reintroduce "whatever was built most recently" as the
# deployed version, which is precisely what pinning exists to prevent.

name: Publish image

# Triggered by the Release workflow finishing, NOT by `release: published`.
#
# That distinction is the whole reason this block looks the way it does. GitHub
# deliberately does not start a workflow from an event raised using GITHUB_TOKEN
# — it is the recursion guard that stops a workflow triggering itself forever.
# release.yml creates the release with GITHUB_TOKEN, so `on: release: published`
# NEVER FIRES. It fails silently: the release appears, and no image is ever
# built. Verified the hard way on v1.0.0, which produced both releases and no
# packages at all.
#
# `workflow_run` is not subject to that restriction, and it also gives the
# property worth having: publishing happens only after release.yml has passed,
# so the semver check and the "must be on main" guard live in exactly one place
# rather than being duplicated here and drifting.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Manual (re)publish. Covers a push that failed on a registry outage or an
  # expired token, and any release created before this trigger was fixed.
  # Rebuilding the same tag from the same commit produces the same image.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v1.4.0"
        required: true

# Least privilege, and both scopes are used:
#   contents: read   -> checking out the tagged commit
#   packages: write  -> pushing to GHCR
#
# GITHUB_TOKEN rather than a personal access token: it is scoped to this
# repository, it expires when the job ends, and there is no long-lived
# credential to rotate or leak.
permissions:
  contents: read
  packages: write
  # The promotion validator reads the check runs on the tagged commit.
  checks: read
  actions: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scopes publishing to the Production environment, so whatever protection
    # rules it carries apply to a manual (re)publish as well as an automatic one.
    environment: Production

    # A failed release must not publish an image. workflow_run fires on
    # completion regardless of outcome, so the conclusion has to be checked
    # explicitly.
    #
    # The `workflow_dispatch ||` arm used to mean a manual run skipped every
    # question that followed. It still short-circuits this particular check —
    # a manual run genuinely has no workflow_run to inspect — but it no longer
    # skips anything else: the validation step below runs unconditionally, and
    # a manual dispatch faces exactly the same questions as an automatic one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Resolve the tag being published
        id: resolve
        env:
          # For a tag push, workflow_run.head_branch is the TAG name, not a branch.
          TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Checked out at the default branch FIRST, only to get the validator and
      # the tag history. Nothing from the candidate commit is built until it has
      # been approved, so a tag pointing at hostile code cannot supply the script
      # that decides whether it is allowed.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gate. A published, non-draft release must exist for this tag, the tag
      # must still point where it did when the release was cut, it must be on
      # main, and CI must have actually passed on that exact commit.
      - name: Validate the tag before building it
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/validate-promotion.sh \
            --tag "${{ steps.resolve.outputs.tag }}" \
            --require-release \
            --require-checks \
            --check "Install, type-check and build" \
            --check "Build the container image"

      # Now, and only now, the candidate. By SHA rather than by tag: the commit
      # that was validated is the commit that gets built, even if the tag were
      # moved between the two steps.
      - name: Check out the approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      - name: Read the Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase image name and the organisation is
      # "Manara-Education", so this cannot just interpolate github.repository.
      - name: Compute the image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.resolve.outputs.tag }}
            ${{ steps.image.outputs.name }}:sha-${{ steps.commit.outputs.sha }}
          # Standard provenance labels, so `docker inspect` on the server can
          # answer which commit and which release an image came from without
          # consulting anything else.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.tag }}
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise what was published
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.resolve.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$IMAGE:$TAG"
            echo "$IMAGE:sha-$SHA"
            echo "digest: $DIGEST"
            echo '```'
            echo
            echo "Pin this in the production .env:"
            echo
            echo '```'
            echo "FRONTEND_IMAGE=$IMAGE:$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
