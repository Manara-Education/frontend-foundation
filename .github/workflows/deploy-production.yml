# Deploys a published frontend release to the production server.
#
# The pipeline this is the last stage of:
#
#     push tag vX.Y.Z
#       -> Release        creates the GitHub Release (validates semver, main-only)
#       -> Publish image  builds and pushes the image to GHCR
#       -> THIS WORKFLOW  pulls that image on the server and restarts the frontend
#
# Nothing is built here and nothing is built on the server. The artifact that
# reaches production is byte-for-byte the one Publish image pushed, which is the
# one built from the released commit that CI had already proven.

name: Deploy to production

# Chained to "Publish image" finishing, NOT to `release: published`, and NOT to
# the Release workflow.
#
# Two separate traps are being avoided here, and both fail silently:
#
#   1. `on: release: published` NEVER FIRES for a release created with
#      GITHUB_TOKEN — GitHub's recursion guard. release.yml creates the release
#      exactly that way. This is not theoretical: v1.0.0 shipped a release with
#      no image because publish.yml was originally written that way.
#
#   2. Chaining to "Publish image" — the obvious choice, since the image existing
#      is the precondition for deploying — LOSES THE VERSION. A workflow_run-
#      triggered run's own `head_branch` is the DEFAULT BRANCH, not the tag that
#      started the chain. Publish can still see the tag because it reads the
#      *Release* run's head_branch; a third workflow chained behind Publish reads
#      Publish's own, which is `develop`. Observed exactly that on v1.0.1:
#
#          RAW_TAG: develop
#          ##[error]Resolved 'develop', which is not a vMAJOR.MINOR.PATCH tag.
#
#      So this chains to "Release", whose head_branch IS the tag, and waits for
#      the image to appear rather than assuming it already has. The wait is the
#      step below, and it is a guard worth having regardless.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Redeploy an existing release: a deployment that failed on a transient error,
  # or a rollback to a known-good tag. Re-running the same tag is safe — it pulls
  # the same immutable image and restarts the same service.
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to deploy, e.g. v1.4.0"
        required: true

permissions:
  contents: read
  # Reading the image manifest from GHCR to prove the tag exists before the
  # server is touched at all.
  packages: read
  # The promotion validator reads the check runs on the tagged commit.
  checks: read
  actions: read

# One deployment at a time. cancel-in-progress is deliberately false: cancelling
# a run mid-way could leave .env rewritten with the service half-restarted.
concurrency:
  group: deploy-production-frontend
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Gate — was the commit this release points at actually assessed?
  # ===========================================================================
  # Before this job existed, deployment depended on nothing security-related.
  # The chain was: tag push -> Release -> (workflow_run) -> deploy. A commit
  # could be tagged and shipped without any security scan ever having looked at
  # it, and nothing in the pipeline would have noticed.
  #
  # This job answers one question: does the exact commit this tag points at carry
  # a `Security Gate` check run that concluded `success`, recently enough to
  # mean anything? If not, the deployment stops here with production untouched.
  #
  # It runs in its OWN job with no `environment:`, so it holds none of the
  # deployment secrets. The gate that decides whether to deploy has no ability to
  # deploy, and nothing a pull request can influence reaches this far — the
  # trigger is a tag on `main` or a manual dispatch, never a pull request.
  assess:
    name: Verify the release was assessed
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      # Reading the Security Gate check run on the released commit.
      checks: read
      # Dispatching a fresh assessment when the recorded one is too old to rely
      # on. This is the one write scope, it acts only on this repository's own
      # `Security` workflow, and it is what makes "stale" recoverable without a
      # bypass.
      actions: write

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      # Same validation as the deploy job used to do alone, moved earlier so that
      # nothing downstream ever sees an unvalidated tag. The deploy job still
      # reads the tag from here rather than re-deriving it, so there is one
      # definition of "which version is being deployed".
      - name: Resolve the release tag to an exact commit
        id: resolve
        env:
          RAW_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Resolved '$RAW_TAG', which is not a vMAJOR.MINOR.PATCH release tag."
            echo "::error::A publish triggered by something other than a release tag does not deploy."
            exit 1
          fi

          # A tag is a movable label and may be annotated, in which case the ref
          # points at a tag object rather than at a commit. Dereferencing it here
          # means everything below is anchored to a commit SHA — the thing that
          # was actually scanned — rather than to a name that can be re-pointed.
          obj_type="$(gh api "repos/$REPO/git/ref/tags/$RAW_TAG" --jq '.object.type')"
          obj_sha="$(gh api  "repos/$REPO/git/ref/tags/$RAW_TAG" --jq '.object.sha')"
          if [ "$obj_type" = "tag" ]; then
            sha="$(gh api "repos/$REPO/git/tags/$obj_sha" --jq '.object.sha')"
          else
            sha="$obj_sha"
          fi

          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::Could not resolve $RAW_TAG to a commit SHA."; exit 1; }

          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"     >> "$GITHUB_OUTPUT"
          echo "Deploying $RAW_TAG -> $sha"

      # The freshness window comes from the policy AT THE RELEASED COMMIT, not
      # from a number written here. If the two could disagree, the deployment
      # gate would be enforcing a different standard from the one the gate itself
      # was built to, and nobody would find out until it mattered.
      - name: Check out the released commit's security policy
        id: checkout_policy
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          sparse-checkout: .github/security/policy.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the freshness window
        id: policy
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f .github/security/policy.yml ]; then
            echo "::error title=Release predates the Security Gate::$TAG does not carry"
            echo "::error::.github/security/policy.yml, so it was built before this"
            echo "::error::repository had a Security Gate and cannot have been assessed by it."
            echo "::error::"
            echo "::error::This deployment is refused. To ship this tag anyway, cut a new"
            echo "::error::release from a commit that carries the gate. Do not remove this"
            echo "::error::check — an unassessed release is exactly what it exists to stop."
            exit 1
          fi
          python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.3'
          hours="$(python3 -c "
          import yaml
          p = yaml.safe_load(open('.github/security/policy.yml'))
          print(int((p.get('intelligence') or {})['max_age_hours']))")"
          echo "max_age_hours=$hours" >> "$GITHUB_OUTPUT"
          echo "An assessment older than ${hours}h will be refreshed before deploying."

      # ---------------------------------------------------------------------
      # The gate itself
      # ---------------------------------------------------------------------
      # This POLLS rather than sampling once, and the distinction is the whole
      # correctness of the step.
      #
      # `security.yml` runs on `push` to `main`; this workflow is chained off
      # `Release`. The two are independent, so when this job starts the Security
      # Gate for the tagged commit is very often still queued or in progress.
      # A step that read the check once would see `queued` and have to guess —
      # and both guesses are wrong. Treating it as a pass ships an unassessed
      # commit; treating it as a failure makes every release fail a race it was
      # always going to lose.
      #
      # So: `success` proceeds, a terminal non-success fails immediately without
      # burning the remaining budget, still-running waits, and running out of time
      # fails. Absent is never a pass — a commit with no Security Gate at all is
      # precisely the case this job exists to refuse.
      #
      # STALENESS. A check that passed is treated by GitHub as passing forever,
      # however old it is. A commit tagged today can carry a Security Gate that
      # went green a week ago, before the advisory that matters was published. So
      # after finding a successful run, its age is compared against the policy's
      # window; if it is too old, a fresh assessment is dispatched against the tag
      # and the FRESH result is what decides. There is no fallback to the stale
      # pass — if the refresh cannot be dispatched or does not finish in time,
      # this job fails.
      - name: Require a fresh, successful Security Gate on the released commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
          MAX_AGE_HOURS: ${{ steps.policy.outputs.max_age_hours }}
          GATE_NAME: 'Security Gate'
          WORKFLOW_FILE: 'security.yml'
        run: |
          set -euo pipefail

          # The newest attempt, by check-run id. Ids increase; `completed_at` is
          # null while a run is in progress, so sorting on it would rank a re-run
          # that is still going below the attempt it supersedes.
          newest_gate() {
            gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[]' 2>/dev/null \
              | jq -s --arg n "$GATE_NAME" \
                  '[.[] | select(.name == $n)] | sort_by(.id) | last // empty'
          }

          # Poll until the gate reaches a terminal state, or the deadline passes.
          # Echoes the winning check run on stdout; anything else is fatal.
          await_gate() {
            local deadline=$(( SECONDS + $1 )) entry status conclusion
            while :; do
              entry="$(newest_gate)"

              if [ -n "$entry" ]; then
                status="$(printf '%s' "$entry" | jq -r '.status')"
                conclusion="$(printf '%s' "$entry" | jq -r '.conclusion // "none"')"

                if [ "$status" = "completed" ]; then
                  if [ "$conclusion" = "success" ]; then
                    printf '%s' "$entry"
                    return 0
                  fi
                  # Terminal and not success. Waiting longer cannot change it.
                  echo "::error title=Security Gate did not pass::The '$GATE_NAME' check on" >&2
                  echo "::error::$SHA (tag $TAG) concluded '$conclusion'." >&2
                  echo "::error::" >&2
                  echo "::error::Production has NOT been touched. Open the Security workflow run" >&2
                  echo "::error::for that commit, fix or formally except the blocking findings, and" >&2
                  echo "::error::cut a new release. Re-running this deployment will not help until" >&2
                  echo "::error::the gate on that commit is green." >&2
                  return 1
                fi
                echo "  '$GATE_NAME' is $status on $SHA; waiting..." >&2
              else
                echo "  no '$GATE_NAME' check on $SHA yet; waiting..." >&2
              fi

              if (( SECONDS >= deadline )); then
                if [ -z "$entry" ]; then
                  echo "::error title=Release was never assessed::No '$GATE_NAME' check run" >&2
                  echo "::error::exists on $SHA (tag $TAG)." >&2
                  echo "::error::" >&2
                  echo "::error::This is refused rather than assumed safe: a commit with no" >&2
                  echo "::error::assessment is not a commit that passed one. Run the Security" >&2
                  echo "::error::workflow against $TAG (Actions -> Security -> Run workflow, ref" >&2
                  echo "::error::$TAG), wait for it to pass, then re-run this deployment." >&2
                else
                  echo "::error title=Security Gate did not finish::The '$GATE_NAME' check on" >&2
                  echo "::error::$SHA was still running when this job's budget ran out." >&2
                  echo "::error::Production has NOT been touched. Re-run this deployment once it" >&2
                  echo "::error::has finished." >&2
                fi
                return 1
              fi
              sleep 20
            done
          }

          echo "Waiting for '$GATE_NAME' on $SHA (tag $TAG)"
          entry="$(await_gate 1200)"

          completed="$(printf '%s' "$entry" | jq -r '.completed_at')"
          age_h="$(python3 -c "
          import datetime as dt
          t = dt.datetime.fromisoformat('$completed'.replace('Z', '+00:00'))
          print(round((dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 3600, 1))")"
          echo "The assessment of $SHA completed ${age_h}h ago; the window is ${MAX_AGE_HOURS}h."

          if python3 -c "import sys; sys.exit(0 if float('$age_h') <= float('$MAX_AGE_HOURS') else 1)"; then
            echo "Security Gate: fresh and successful on $SHA. Deployment may proceed."
            exit 0
          fi

          # Too old to rely on. Dispatch a fresh assessment against the TAG — the
          # workflow resolves it back to this same commit — and require the new
          # result. Never the old one.
          previous_id="$(printf '%s' "$entry" | jq -r '.id')"
          echo "::warning::The recorded assessment of $SHA is ${age_h}h old. Dispatching a"
          echo "::warning::fresh Security run against $TAG before deploying."

          if ! gh workflow run "$WORKFLOW_FILE" --repo "$REPO" --ref "$TAG"; then
            echo "::error title=Could not refresh the assessment::Dispatching '$WORKFLOW_FILE'"
            echo "::error::against $TAG failed, and the existing assessment is ${age_h}h old —"
            echo "::error::older than the ${MAX_AGE_HOURS}h this repository's own policy allows."
            echo "::error::"
            echo "::error::Refusing to deploy on a stale pass. Production has NOT been touched."
            exit 1
          fi

          # Wait for a check run that is genuinely new, identified by an id higher
          # than the one just read. Matching on "completed recently" would accept
          # the stale run all over again.
          echo "Waiting for the fresh assessment to appear and finish"
          deadline=$(( SECONDS + 2100 ))
          while :; do
            entry="$(newest_gate)"
            if [ -n "$entry" ]; then
              id="$(printf '%s' "$entry" | jq -r '.id')"
              if [ "$id" != "$previous_id" ]; then
                status="$(printf '%s' "$entry" | jq -r '.status')"
                if [ "$status" = "completed" ]; then
                  conclusion="$(printf '%s' "$entry" | jq -r '.conclusion // "none"')"
                  if [ "$conclusion" = "success" ]; then
                    echo "Fresh Security Gate on $SHA concluded success. Deployment may proceed."
                    exit 0
                  fi
                  echo "::error title=Fresh Security Gate failed::The re-assessment of $SHA"
                  echo "::error::concluded '$conclusion'. Something has been published since the"
                  echo "::error::original scan. Production has NOT been touched."
                  exit 1
                fi
                echo "  fresh assessment is $status; waiting..."
              else
                echo "  fresh assessment has not registered a check run yet; waiting..."
              fi
            fi
            if (( SECONDS >= deadline )); then
              echo "::error title=Refresh did not finish::The fresh assessment of $SHA did not"
              echo "::error::complete in time, and the previous one is ${age_h}h old. Refusing to"
              echo "::error::deploy on a stale pass. Production has NOT been touched."
              exit 1
            fi
            sleep 20
          done

      - name: Record the assessment in the summary
        if: always()
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          {
            echo "### Pre-deployment security assessment — ${{ job.status }}"
            echo
            echo '```'
            echo "tag     $TAG"
            echo "commit  $SHA"
            echo "gate    Security Gate"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy the frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The deployment cannot start until the released commit has been shown to
    # carry a fresh, successful Security Gate. `needs:` is what makes that a hard
    # dependency rather than a parallel job whose failure nobody notices.
    needs: assess

    # Scopes the deployment secrets to this job and applies whatever protection
    # rules the Production environment carries.
    environment:
      name: Production
      url: https://manara-edu.com

    # workflow_run fires on completion whatever the outcome, so a FAILED publish
    # would otherwise deploy. The conclusion has to be checked explicitly.
    #
    # The `workflow_dispatch ||` arm short-circuits only this check, which a
    # manual run has nothing to evaluate against. Everything else below runs
    # unconditionally: a manual deployment now answers the same questions an
    # automatic one does. Previously it answered none of them beyond tag syntax.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ---------------------------------------------------------------------
      # 1. Which version is being deployed
      # ---------------------------------------------------------------------
      # For a run chained from a tag push, workflow_run.head_branch carries the
      # TAG name rather than a branch. It is validated rather than trusted: if
      # it is ever anything else the deployment stops here, with the server
      # untouched, instead of guessing at a version.
      # The tag now arrives from the `assess` job, which resolved and validated it
      # before anything security-related was checked — so there is exactly one
      # definition of "which version is being deployed" and the commit the gate
      # was verified against is the commit deployed here. The syntax check is
      # repeated rather than assumed: it is two lines, and a job output is still
      # a string arriving from somewhere else.
      - name: Resolve the release tag
        id: resolve
        env:
          RAW_TAG: ${{ needs.assess.outputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Resolved '$RAW_TAG', which is not a vMAJOR.MINOR.PATCH release tag."
            echo "::error::A publish triggered by something other than a release tag does not deploy."
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying $RAW_TAG"

      # ---------------------------------------------------------------------
      # 2. Prove the tag deserves to be deployed
      # ---------------------------------------------------------------------
      # Tag syntax was previously the only question asked, and on a manual run
      # not even the release check applied. So any semver-shaped tag, pointing
      # anywhere, could be deployed by anyone able to dispatch this workflow.
      #
      # The same validator the release and publish workflows use: a published,
      # non-draft release, still pointing at the same commit, on main, with CI
      # green on that exact commit.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag before deploying it
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/validate-promotion.sh \
            --tag "${{ steps.resolve.outputs.tag }}" \
            --require-release \
            --require-checks \
            --check "Install, type-check and build" \
            --check "Build the container image" \
            --check "Security Gate"

      # ---------------------------------------------------------------------
      # 3. Prove the image exists BEFORE touching production
      # ---------------------------------------------------------------------
      # The server pulls this tag in a moment. Resolving it here first means a
      # missing or half-published image fails on the runner, while production is
      # still happily serving the previous version, rather than mid-deployment.
      # It also records the digest, which is what actually identifies the
      # artifact — a tag is a movable label, a digest is not.
      - name: Wait for the image to be published to GHCR
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          # "Publish image" starts from the same Release run this workflow did, so
          # it is usually still building. Polling for the tag is what synchronises
          # the two without needing the version to survive a second workflow_run
          # hop — and it fails on the runner, with production still serving the
          # previous version, rather than part-way through a deployment.
          deadline=$(( SECONDS + 900 ))
          until docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "::error::$IMAGE:$TAG never appeared in GHCR after 15 minutes."
              echo "::error::Check whether the 'Publish image' run for $TAG succeeded."
              exit 1
            fi
            echo "waiting for $IMAGE:$TAG ..."
            sleep 20
          done

          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')"

          # The tag says which image; it does not say the image came from the
          # commit that was just approved. Publish tags every image twice — once
          # with the version and once with :sha-<commit> — so if those two tags
          # do not resolve to the same digest, the version tag has been re-pushed
          # over a different build and this deployment is not carrying the code
          # that was validated.
          SHA_DIGEST="$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --format '{{.Manifest.Digest}}')"
          if [ "$DIGEST" != "$SHA_DIGEST" ]; then
            echo "::error::$IMAGE:$TAG is $DIGEST but $IMAGE:sha-$SHA is $SHA_DIGEST."
            echo "::error::The version tag does not point at the build for the approved commit."
            exit 1
          fi

          # And the image's own provenance label must agree, independently of
          # how it was tagged.
          REVISION="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" \
                        --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$REVISION" != "$SHA" ]; then
            echo "::error::Image $DIGEST claims revision '$REVISION', not the approved $SHA."
            exit 1
          fi

          echo "image=$IMAGE"   >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved $IMAGE:$TAG -> $DIGEST (revision $SHA)"

      # ---------------------------------------------------------------------
      # 4. Scan the image that is actually about to be deployed
      # ---------------------------------------------------------------------
      # The Security Gate already scanned an image — but one it BUILT itself from
      # the source tree. This scans the one GHCR is holding, addressed BY DIGEST
      # rather than by tag, which is the only way to be certain the bytes examined
      # here are the bytes the server pulls in the next step. A tag can be
      # re-pushed between two `docker pull`s; a digest cannot.
      #
      # This is deliberately the last thing that happens before the SSH key is
      # written. Everything above proved the image corresponds to an approved
      # commit; this proves the image itself is currently acceptable, using
      # today's vulnerability database rather than whatever was current when the
      # release was cut.
      #
      # The threshold matches policy.yml's `block_at_or_above: HIGH`. Trivy's
      # `--exit-code 1` is used here, unlike in security.yml, and the difference
      # is intentional: this is not the gate, it is a last-moment safety
      # interlock, and there is no evaluator in this workflow to hand a report to.
      - name: Install the pinned scanner
        run: bash .github/security/install-scanner.sh trivy

      - name: Scan the published image by digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Scanning $IMAGE@$DIGEST"

          # --ignore-unfixed is NOT set. A vulnerability with no fix available is
          # still a vulnerability in production, and hiding it here would make
          # this interlock quietly weaker than the gate it backs up.
          trivy image "$IMAGE@$DIGEST" \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 1 \
            --output image-scan.txt || scan_failed=1

          cat image-scan.txt

          {
            echo "### Pre-deployment image scan"
            echo
            echo '```'
            echo "image   $IMAGE"
            echo "digest  $DIGEST"
            echo '```'
            echo
            echo '<details><summary>Trivy HIGH/CRITICAL findings</summary>'
            echo
            echo '```'
            cat image-scan.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${scan_failed:-0}" = "1" ]; then
            echo "::error title=Published image has blocking findings::$IMAGE@$DIGEST"
            echo "::error::carries HIGH or CRITICAL vulnerabilities. Production has NOT been"
            echo "::error::touched and is still serving the previous version."
            echo "::error::"
            echo "::error::This can happen even when the release's Security Gate was green:"
            echo "::error::the advisory may have been published after the release was cut."
            echo "::error::Fix or formally except the findings and cut a new release."
            exit 1
          fi
          echo "No HIGH or CRITICAL findings in the image about to be deployed."

      # ---------------------------------------------------------------------
      # 5. SSH
      # ---------------------------------------------------------------------
      # The host key is pinned rather than accepted on first sight. `ssh-keyscan`
      # into known_hosts trusts whatever answers on the day, which is the one
      # thing host-key checking exists to prevent — and this connection carries
      # the right to restart production.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC9vjpkD1lqIDMx/gUnhc3AbZgWXBPIQwBPYWr6JvY6H\n' \
            "$HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ---------------------------------------------------------------------
      # 6. Deploy
      # ---------------------------------------------------------------------
      # scripts/deploy.sh is the deployment abstraction that lives with the
      # compose file on the server: it pulls the exact tag, rewrites only the
      # BACKEND_IMAGE pin, restarts only this service, waits for the container to
      # report healthy, and restores the previous pin and exits non-zero if it
      # does not. Reimplementing that here would mean two definitions of what a
      # deployment is, drifting apart.
      #
      # No secret is passed over this connection. The server's .env already holds
      # them at mode 600 and is the only place they exist.
      - name: Deploy to Hetzner
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          TAG: ${{ steps.resolve.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # The digest was resolved and then thrown away before: the server was
          # asked to pull a tag and re-resolved it itself, so what production ran
          # was whatever the tag meant at pull time rather than what was approved
          # here. deploy.sh now takes the digest and pins repo:tag@digest.
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Refusing to deploy without a resolved digest (got '$DIGEST')."
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=20 "$USER@$HOST" \
              "cd /opt/manara && ./scripts/deploy.sh frontend '$TAG' '$DIGEST'"

      # ---------------------------------------------------------------------
      # 7. Prove it from outside
      # ---------------------------------------------------------------------
      # deploy.sh asserts the container reports healthy, but the frontend
      # container's own healthcheck is `caddy validate` — it proves the config
      # parses, not that the site serves. This service IS the ingress: it
      # terminates TLS and serves the SPA, so an external request is the only
      # check that exercises what was just replaced. The API route is included
      # because a Caddyfile mistake takes out /api/* while / still returns the
      # SPA perfectly, which looks like a healthy deployment and is not.
      - name: Verify production is serving
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            root="$(curl -fsS -m 20 -o /dev/null -w '%{http_code}' https://manara-edu.com/ || echo 000)"
            # 204 is this endpoint's success: it sets the CSRF cookie and returns
            # no body. Reaching it at all proves /api/* still routes to the
            # backend through the new Caddy configuration.
            api="$(curl -fsS -m 20 -o /dev/null -w '%{http_code}' https://manara-edu.com/api/v1/auth/csrf || echo 000)"
            if [ "$root" = "200" ] && [ "$api" = "204" ]; then
              echo "https://manara-edu.com/ -> 200, /api/v1/auth/csrf -> 204"
              exit 0
            fi
            echo "attempt $attempt: root=$root api=$api, retrying..."
            sleep 10
          done
          echo "::error::Production did not serve correctly after the deployment (root=$root api=$api)."
          exit 1

      - name: Summarise the deployment
        if: always()
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Frontend deployment — ${{ job.status }}"
            echo
            echo '```'
            echo "tag     $TAG"
            echo "image   $IMAGE:$TAG"
            echo "digest  $DIGEST"
            echo '```'
            echo
            echo "If this failed, production is still serving whatever it was before the"
            echo "restart, and no volume was touched. Roll back with:"
            echo
            echo '```'
            echo "ssh <deploy-user>@<host> 'cd /opt/manara && ./scripts/rollback.sh frontend'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
